<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Speech to FSL</title>

    <link rel="stylesheet" href="popup.css">
</head>

<body>

    <div class="container">

        <h1>Speech to FSL</h1>

        <p class="description">
            Real-Time Speech to Filipino Sign Language Translator
        </p>

        <div class="status-container">
            <span>Status:</span>
            <span id="status">Idle</span>
        </div>

        <div class="button-container">

            <button id="startBtn">
                Start Translation
            </button>

            <button id="stopBtn">
                Stop Translation
            </button>

        </div>

    </div>

    <script src="popup.js"></script>

</body>
</html>
